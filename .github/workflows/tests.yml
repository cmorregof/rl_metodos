name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { project: 01_biseccion,  package: bisectrl }
          - { project: 02_punto_fijo, package: fixpointrl }
          - { project: 03_taylor,     package: taylorrl }
          - { project: 04_newton,     package: newtonrl }
          - { project: 05_secante,    package: secantrl }
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m ${{ matrix.package }} --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs
