name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { project: 01_biseccion,  package: bisectrl,   smoke: "python -m bisectrl --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs" }
          - { project: 02_punto_fijo, package: fixpointrl, smoke: "python -m fixpointrl --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs" }
          - { project: 03_taylor,     package: taylorrl,   smoke: "python -m taylorrl --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs" }
          - { project: 04_newton,     package: newtonrl,   smoke: "python -m newtonrl --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs" }
          - { project: 05_secante,    package: secantrl,   smoke: "python -m secantrl --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs" }
          - { project: 07_interpolacion, package: interprl, smoke: "python -m interprl --no-tui --episodes1 800 --episodes2 800 --out /tmp/runs && python -m interprl search --n 4 --iters 5 --out /tmp/runs" }
          - { project: 06_stepsizes,  package: steprl,     smoke: "python -m steprl verify && python -m steprl evolve --provider mock --generations 1 --anytime-n 7,9 --out /tmp/runs" }
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ${{ matrix.smoke }}
