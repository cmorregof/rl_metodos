[project]
name = "fixpointrl"
version = "0.1.0"
description = "Un agente de RL aprende a controlar la iteración de punto fijo y a demostrar el teorema de Banach, en vivo en la terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fixpointrl = "fixpointrl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fixpointrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
