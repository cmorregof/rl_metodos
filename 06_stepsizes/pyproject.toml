[project]
name = "steprl"
version = "0.1.0"
description = "Programas de pasos para el descenso de gradiente con el PEP como verificador: búsqueda numérica y evolución guiada por LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "cvxpy>=1.5", "clarabel>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pepit>=0.3"]
llm = ["openai>=1.50", "anthropic>=1.0"]

[project.scripts]
steprl = "steprl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["steprl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::UserWarning"]
