[project]
name = "interprl"
version = "0.1.0"
description = "Un agente de RL aprende dónde y cuántos nodos poner para interpolar, demuestra el teorema del error y busca nodos con constante de Lebesgue mínima."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
interprl = "interprl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interprl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
